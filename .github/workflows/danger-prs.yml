name: Run Danger on PRs
on:
  pull_request:
    # Not sure whether we actually want to run on reopened, the code shouldn't
    # have changed right?
    types: [opened, reopened, synchronize]

jobs:
  danger_check_pr_ios_specific:
    name: "iOS Sanity Checks"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - uses: actions/setup-node@v1
        with:
          node-version: '10.x'

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install Danger JS with Yarn
        run: |
          yarn install  --frozen-lockfile

      - name: Perform sanity checks for the iOS projects
        run: yarn danger ci --dangerfile Automattic/peril-settings/org/pr/ios-macos.ts
        env:
          GITHUB_TOKEN: ${{ secrets.MOKAGIO_BOT_GITHUB_TOKEN }}
